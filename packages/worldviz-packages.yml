package_manager:
  name: Vizard Package Manager
  docs: https://docs.worldviz.com/vizard/latest/Package_Manager.htm
  direction: consumer
  note: >-
    Vizard ships a GUI package manager that searches and installs from PyPI (and accepts
    local .whl files) into Vizard's bundled Python. It is a pip client — it CONSUMES the
    Python ecosystem, it does not publish WorldViz packages to it. Recorded here so a reader
    does not mistake it for a WorldViz-operated registry.
