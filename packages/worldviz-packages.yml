name: WorldViz Packages and Distributions
description: >-
  WorldViz distributes its developer surface as downloadable Windows software, not as
  registry-published client libraries. Vizard is a Python-based VR development toolkit and
  IDE installed on a workstation; SightLab VR Pro is a Vizard plugin; the OSG and Cal3D
  exporters are 3ds Max plugins served as version-pinned installers from WorldViz's own S3
  bucket. There is no npm, PyPI, Maven, NuGet, RubyGems, Packagist, crates.io or Go module
  published by WorldViz, because there is no web API for a client library to wrap.
