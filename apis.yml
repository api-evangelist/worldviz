aid: worldviz
name: WorldViz
description: >-
  WorldViz LLC is a Santa Barbara, California virtual reality company that builds VR software
  and turnkey systems for academic research, training and simulation. Its developer surface is
  Vizard, a Python 3.13 VR development toolkit and IDE for Windows with a documented command
  reference of roughly 1,182 commands across 36 modules, extended by the SightLab VR Pro
  experiment-authoring plugin, the Vizible collaboration product, PPT precision motion
  tracking, and PRISM projection and simulation room systems. WorldViz publishes no web API:
  no OpenAPI, AsyncAPI, GraphQL schema, MCP server, agent card or .well-known document was
  found on any of its eight public hosts. Its machine-relevant surface is the Vizard Python
  library reference, its dated release notes, and its downloadable installers.
